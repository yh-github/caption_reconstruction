base_params:
  master_seed: 2025

data_config:
  name: "video_storytelling"
  path: "datasets/storytelling/"
  limit: 100

recon_strategy:
  - name: "pro_d_one_shot_v1__t=0.2"
    type: "llm"
    llm:
      model_name: "gemini-2.5-pro"
      thought_budget: -1
      temperature: 0.2
      prompt_template: "prompts/dense_one_shot_v1.txt"
  - name: "pro_d_one_shot_v1__t=1.0"
    type: "llm"
    llm:
      model_name: "gemini-2.5-pro"
      thought_budget: -1
      temperature: 1
      prompt_template: "prompts/dense_one_shot_v1.txt"

masking_configs:
  - scheme: "contiguous"
    seed: [11,22]
    width: [1,2,3,4,5,6,7]

