base_params:
  master_seed: 2025
  experiment_type: "recon"

evaluation:
  type: "emb_sim"

data_config:
  name: "wild_captions"
  path: "datasets/wildQA/captions__wild2/"
  limit: 100

recon_strategy:
  - name: "pro_d_one_shot_v1__t=1"
    type: "llm"
    llm:
      model_name: "gemini-2.5-pro"
      thought_budget: -1
      temperature: 1
      prompt_template: "prompts/dense_one_shot_v1.txt"
  - name: "baseline_repeat_last"
    type: "baseline_repeat_last"


masking_configs:
  - scheme: "contiguous"
    seed: [11,22]
    #width: [6,9,12,15,18]
    width: [6,9,12,15,18,21,24,27,30,33,36,39,42,45]


