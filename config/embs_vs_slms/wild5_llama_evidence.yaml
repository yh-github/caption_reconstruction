base_params:
  master_seed: 2025
  experiment_type: "recon"

evaluation:
  type: "emb_retrieval"
  embedding_model: "local:all-mpnet-base-v2"

data_config:
  name: "wild_captions"
  path: "datasets/wildQA/captions__wild5/"

recon_strategy:
  - name: "llama-3.1-8b__whole_window__t=0.6"
    type: "local_llm"
    model_key: "llama-3.1-8b"
    strategy_mode: "whole_window"
    prompt_dir: "prompts/dense_window"
    temperature: 0.6
    repetition_penalty: 1.05
    max_new_tokens: 512

masking_configs:
  - scheme: "evidence"
    dataset_path: "datasets/wildQA/test.json"
    filter_scene_only: true
    max_duration: 60.0
    single_evidence_only: true
    max_evidence_duration: 15.0
