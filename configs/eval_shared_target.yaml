# Evaluation Configuration for Shared-Target Redesign (Rows 1–3)
# Pre-registered configuration: commit before first full benchmark run.

dataset:
  master_csv: "results/unified_benchmark_master.csv"
  visual_embs_dir: "local/wild_videos_embs_siglip"
  captions_dirs:
    Wild4: "datasets/wildQA/captions__wild4"
    Wild5: "datasets/wildQA/captions__wild5"
  hf_repo: "Y3/dense_video_captions"
  llama_hf_dirs:
    Wild4_w3: "reconstruction/wild4_llama_w3_window_v3"
    Wild4_w6: "reconstruction/wild4_llama_w6"
    Wild5_w3: "reconstruction/wild5_llama_w3_w6"
    Wild5_w6: "reconstruction/wild5_llama_w3_w6"
  # SigLIP 2: the stored frames are SigLIP 2 (timm v2_webli). The original SigLIP 1 text tower is not in
  # their space (frame-home T_Oracle came out at c ~ 0); results from it were moved to results/invalid_siglip1_text/.
  siglip_model: "google/siglip2-base-patch16-224"
  siglip_text_cache: "disk_cache/local_google_siglip2-base-patch16-224_text"

arms:
  text:
    - "T_LLM"
    - "T_RepeatClosest"
    - "T_MeanClosest"
    - "T_Oracle"
    - "T_RandWithinDomain"
    - "T_RandCorpus"
    - "T_LLM_gapmean"
  visual:
    - "V_MeanClosest"
    - "V_RepeatClosest"
    - "V_Oracle"
    - "V_RandFrame"

strata:
  same_video_near:
    window_sec: 10
    sample_size: null  # all available (<= 18)
    enters_headline: true
  same_video_far:
    sample_size: 30
    enters_headline: true
  other_video_other_channel:
    sample_size: 30
    enters_headline: false
  other_video_same_channel:
    sample_size: 30
    enters_headline: false
  boundary_diag:
    window_sec: 10
    sample_size: null  # all available + 2 boundaries (<= 20)
    enters_headline: false

pool_sampling:
  num_draws: 10
  seed: 42

statistics:
  bootstrap_resamples: 10000
  alpha: 0.05
  equivalence_margin: 0.05
  primary_family:
    - "C1: T_LLM - T_RepeatClosest (W=3)"
    - "C2: T_LLM - T_RepeatClosest (W=6)"
    - "C3: T_LLM - T_MeanClosest (W=3)"
    - "C4: T_LLM - T_MeanClosest (W=6)"

gates:
  G1_v_oracle_frame_home_c: 1.0
  G1_max_tie_rate: 0.01
  G2_random_max_abs_c: 0.03
  G3_t_oracle_min_c: 0.20
  G4_arm_drift_max: 0.03
  G5_max_failure_rate: 0.05
  headroom_min: 0.10

persistence_sweep:
  widths: [1, 2, 3, 4, 6, 8, 12, 16, 24, 30]
  placements_per_video: 3
